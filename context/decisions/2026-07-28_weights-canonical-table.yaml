id: 2026-07-28_weights-canonical-table
title: "PITO/DIDO weights: one versioned machine-readable table, consumed by every surface"
date: 2026-07-28
status: proposed          # needs Foundation-side decision on the actual weight values
scope: network
supersedes: []
superseded_by: null
authors:
  - tomas.vivanco
attribution:
  - kind: human
    name: Tomas Vivanco
    role: audited the three tables; drafted proposal and the comparison artifact
  - kind: ai-subagent
    model: claude-fable
    surface: cowork
    role: extracted the exhibition console's table, computed the divergence
prior_state: |
  Three PITO/DIDO weight tables circulate, none machine-readable, none
  versioned:
  (1) the FCI 3.0 site's v0 table — 12 of 20 cells populated, three
      flagged for review;
  (2) FC_MetricsDashboard's set — 6 cells documented from (1), 14
      reconstructed from the Full Stack Metrics Framework [Vivanco 2024],
      every cell flagged site/reconstructed;
  (3) the exhibition console's full 20-cell table (hard-coded).
  (2) and (3) agree on exactly 5 of 20 cells. All Governance cells differ
  (dashboard ~0.1–0.2 PITO, console 0.0); all Social cells differ; the
  Environmental and Economic gradients differ at Region and above.
change: |
  a) A single canonical weights.json — versioned, machine-readable, one
     entry per cell with pito, dido, provenance (documented | proposed),
     and review status — published where the methodology lives, consumed
     at build/snapshot time by every surface (site, dashboards, console,
     observatory). No surface hard-codes weights again.
  b) FC_MetricsDashboard/data/weights.json (generated by
     scripts/gen_weights_json.js) is offered as the starting artifact:
     it already carries both divergent tables side by side with an
     agreement flag per cell.
  c) The weight VALUES themselves remain open — this record proposes the
     mechanism, not the numbers. The three cells the site flags for
     sharpened argument (Economic × Bioregion, Environmental × Community,
     Economic × Community) plus the 15 divergent cells are the review's
     scope, with the console's table and the dashboard's reconstruction
     as the two candidate positions on the table.
reasoning: |
  Weights are the projection matrix of the whole instrument: the model
  completion, the simulation, the Boeing recovery and the matryoshka
  strip all run through them. Two surfaces disagreeing on 15 of 20 cells
  means the same city scores differently depending on which artifact a
  reviewer happens to open — the exact failure mode the provenance
  discipline exists to prevent, one level up. A versioned table also
  gives cities something citable, which the professionalisation roadmap
  (A·P2) names as a blocker.
artifacts_changed:
  - FC_MetricsDashboard/data/weights.json (new, generated)
  - FC_MetricsDashboard/scripts/gen_weights_json.js (new)
  - FC_MetricsDashboard/index.html (divergence table in the open-gaps view)
review:
  required_acks: [tomas.diez, fab-city-foundation.research]
  acks_received: []
  closes: 2026-09-30
  note: |
    Weight-value review should run as its own process (the site's
    review-pito-dido-cell-weights); this record only fixes the mechanism.
